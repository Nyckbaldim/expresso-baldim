<header class="header">
  <a routerLink="/" class="logo" aria-label="Expresso Baldim — ir para o site">
    <!-- 127 × 96 mantém a proporção do arquivo (2376 × 1792) -->
    <img [ngSrc]="logo" width="127" height="96" priority alt="Expresso Baldim Transportes e Mudanças" />
  </a>
  <nav class="admin-nav" aria-label="Navegação administrativa">
    <a routerLink="/admin/pedidos" routerLinkActive="is-active" ariaCurrentWhenActive="page">Pedidos</a>
    <a routerLink="/admin/avaliacoes" routerLinkActive="is-active" ariaCurrentWhenActive="page">Avaliações</a>
  </nav>
  <div class="header__acoes">
    <button type="button" class="eb-btn eb-btn--secondary eb-btn--compact" (click)="voltarAoSite()">
      Voltar ao site <span aria-hidden="true">↗</span>
    </button>
    @if (autenticado()) {
      <button type="button" class="eb-btn eb-btn--secondary eb-btn--compact" (click)="sair()">
        Sair <span aria-hidden="true">↗</span>
      </button>
    }
  </div>
</header>

<main id="conteudo"><router-outlet /></main>

<footer class="footer">
  <small>© {{ year }} Expresso Baldim Transportes e Mudanças</small>
</footer>
